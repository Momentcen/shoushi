<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 手势交互粒子系统 - 修复版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        /* 摄像头预览 - 增加边框提示状态 */
        #video-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            z-index: 10;
        }
        #video-preview {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            transform: scaleX(-1);
            object-fit: cover;
            border: 2px solid #333;
        }
        /* 调试信息覆盖在视频上 */
        #debug-overlay {
            position: absolute;
            top: 5px; left: 5px;
            color: #00ff00;
            font-size: 10px;
            background: rgba(0,0,0,0.5);
            padding: 2px 4px;
            pointer-events: none;
        }

        #ui-container {
            position: absolute;
            top: 20px; right: 20px;
            width: 280px;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            z-index: 100;
        }

        h2 { margin: 0 0 15px 0; font-size: 18px; color: #00ffff; }
        select, input[type="color"] {
            width: 100%; padding: 8px; margin-bottom: 10px;
            background: #333; border: 1px solid #555; color: white; border-radius: 4px;
        }
        
        .status-panel {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            color: #aaa;
        }
        .status-item { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; }
        .dot.ok { background: #00ff00; box-shadow: 0 0 5px #00ff00; }
        .dot.error { background: #ff0000; }

        #loading {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff; font-size: 24px; font-weight: bold;
            pointer-events: none; z-index: 200;
            background: rgba(0,0,0,0.7);
            padding: 20px; border-radius: 10px;
        }
    </style>
</head>
<body>

    <div id="loading">正在加载 AI 模型 (0%)...</div>

    <div id="video-container">
        <video id="video-preview" autoplay playsinline muted></video>
        <div id="debug-overlay">等待数据...</div>
    </div>

    <div id="ui-container">
        <h2>粒子控制台</h2>
        <select id="shape-select">
            <option value="heart">机械之心 (Heart)</option>
            <option value="flower">数字莲花 (Flower)</option>
            <option value="saturn">土星环 (Saturn)</option>
            <option value="fireworks">爆炸烟花 (Fireworks)</option>
        </select>
        <input type="color" id="color-picker" value="#00ffff">
        
        <div class="status-panel">
            <div class="status-item"><div class="dot" id="st-cam"></div><span>摄像头状态</span></div>
            <div class="status-item"><div class="dot" id="st-ai"></div><span>AI 模型状态</span></div>
            <div class="status-item"><div class="dot" id="st-hand"></div><span id="txt-hand">未检测到手势</span></div>
            <div style="margin-top:5px; color:#666;">距离: <span id="dist-val">0.00</span></div>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // 变量
        let scene, camera, renderer, particles, controls;
        let originalPositions = [], particleCount = 12000;
        let handLandmarker;
        let videoElement = document.getElementById('video-preview');
        let interactionFactor = 1.0;
        let lastVideoTime = -1;
        let isVideoPlaying = false;

        // UI 元素
        const stCam = document.getElementById('st-cam');
        const stAi = document.getElementById('st-ai');
        const stHand = document.getElementById('st-hand');
        const txtHand = document.getElementById('txt-hand');
        const distVal = document.getElementById('dist-val');
        const debugOverlay = document.getElementById('debug-overlay');
        const loadingDiv = document.getElementById('loading');

        // 1. 初始化 Three.js
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);
            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;

            // 粒子
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            const material = new THREE.PointsMaterial({
                color: 0x00ffff, size: 0.2, transparent: true, opacity: 0.8,
                blending: THREE.AdditiveBlending
            });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            generateShape('heart');
            animate();
        }

        function generateShape(type) {
            const positions = [];
            for(let i=0; i<particleCount; i++) {
                let x, y, z;
                const t = Math.random() * Math.PI * 2;
                const u = Math.random() * Math.PI;

                if(type === 'heart') {
                    x = 16 * Math.pow(Math.sin(t), 3) * Math.sin(u);
                    y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * Math.sin(u);
                    z = 6 * Math.cos(u);
                    x*=0.5; y*=0.5; z*=0.5;
                } else if (type === 'flower') {
                    const r = 10 * Math.sin(5 * t) * Math.sin(u) + 2;
                    x = r * Math.sin(u) * Math.cos(t);
                    y = r * Math.sin(u) * Math.sin(t);
                    z = r * Math.cos(u);
                } else if (type === 'saturn') {
                    if (i < particleCount * 0.4) {
                         const r = 6;
                         x = r * Math.sin(u) * Math.cos(t);
                         y = r * Math.sin(u) * Math.sin(t);
                         z = r * Math.cos(u);
                    } else {
                         const ang = Math.random() * 6.28;
                         const rad = 8 + Math.random() * 6;
                         x = Math.cos(ang) * rad;
                         z = Math.sin(ang) * rad;
                         y = (Math.random()-0.5) * 0.5;
                    }
                } else {
                    // random
                    x = (Math.random()-0.5)*30;
                    y = (Math.random()-0.5)*30;
                    z = (Math.random()-0.5)*30;
                }
                positions.push(x, y, z);
            }
            originalPositions = positions;
        }

        // 2. 初始化 MediaPipe (关键修复点)
        async function setupMediaPipe() {
            try {
                loadingDiv.innerText = "正在加载视觉模型...";
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });
                
                loadingDiv.style.display = 'none';
                stAi.classList.add('ok');
                startWebcam();
            } catch (error) {
                console.error(error);
                loadingDiv.innerText = "模型加载失败，请刷新重试";
                stAi.classList.add('error');
            }
        }

        function startWebcam() {
            // 尝试请求更大分辨率以提高精度
            const constraints = { video: { width: 640, height: 480 } };
            
            navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                videoElement.srcObject = stream;
                stCam.classList.add('ok');
                
                // 【修复】必须监听加载完成并显式调用 play()
                videoElement.addEventListener("loadeddata", () => {
                    videoElement.play(); 
                    isVideoPlaying = true;
                    predictWebcam();
                });

            }).catch(err => {
                console.error("Camera Error:", err);
                stCam.classList.add('error');
                loadingDiv.innerText = "无法访问摄像头";
                loadingDiv.style.display = 'block';
            });
        }

        async function predictWebcam() {
            // 确保视频正在播放且有尺寸
            if (handLandmarker && isVideoPlaying && videoElement.videoWidth > 0) {
                let startTimeMs = performance.now();
                
                if (videoElement.currentTime !== lastVideoTime) {
                    lastVideoTime = videoElement.currentTime;
                    const results = handLandmarker.detectForVideo(videoElement, startTimeMs);

                    if (results.landmarks && results.landmarks.length > 0) {
                        // 检测到手
                        stHand.classList.add('ok');
                        txtHand.innerText = "手势控制中";
                        
                        const landmarks = results.landmarks[0];
                        const thumb = landmarks[4];
                        const index = landmarks[8];
                        
                        // 计算3D距离
                        const d = Math.sqrt(
                            Math.pow(thumb.x - index.x, 2) + 
                            Math.pow(thumb.y - index.y, 2) + 
                            Math.pow(thumb.z - index.z, 2)
                        );

                        // 更新UI数值
                        distVal.innerText = d.toFixed(3);
                        debugOverlay.innerText = `Thumb-Index: ${d.toFixed(3)}`;

                        // 映射逻辑: 0.03(合) -> 0.15(开)
                        // 映射到缩放: 0.1 -> 2.5
                        let target = THREE.MathUtils.mapLinear(d, 0.03, 0.15, 0.3, 2.5);
                        target = THREE.MathUtils.clamp(target, 0.3, 3.0);
                        
                        interactionFactor = THREE.MathUtils.lerp(interactionFactor, target, 0.15);

                    } else {
                        // 未检测到手
                        stHand.classList.remove('ok');
                        txtHand.innerText = "未检测到手";
                        debugOverlay.innerText = "无手势";
                        interactionFactor = THREE.MathUtils.lerp(interactionFactor, 1.0, 0.05);
                    }
                }
            }
            window.requestAnimationFrame(predictWebcam);
        }

        // 3. 动画循环
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const pos = particles.geometry.attributes.position.array;
            
            for(let i=0; i<particleCount; i++) {
                const ix = i*3, iy = i*3+1, iz = i*3+2;
                
                // 目标位置 * 缩放系数
                const tx = originalPositions[ix] * interactionFactor;
                const ty = originalPositions[iy] * interactionFactor;
                const tz = originalPositions[iz] * interactionFactor;

                // 简单的弹性跟随
                pos[ix] += (tx - pos[ix]) * 0.08;
                pos[iy] += (ty - pos[iy]) * 0.08;
                pos[iz] += (tz - pos[iz]) * 0.08;
            }
            particles.geometry.attributes.position.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // 事件监听
        document.getElementById('shape-select').addEventListener('change', (e) => generateShape(e.target.value));
        document.getElementById('color-picker').addEventListener('input', (e) => particles.material.color.set(e.target.value));

        initThree();
        setupMediaPipe();
    </script>
</body>
</html>
