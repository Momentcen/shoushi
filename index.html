<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 手势交互粒子系统 - 宏视智能概念Demo</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }
        
        /* 摄像头预览 (左下角，仅供调试，实际可隐藏) */
        #video-preview {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 160px;
            height: 120px;
            border-radius: 8px;
            transform: scaleX(-1); /* 镜像 */
            opacity: 0.7;
            border: 2px solid #00ffff;
            z-index: 10;
        }

        /* UI 控制面板 */
        #ui-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h2 { margin: 0 0 15px 0; font-size: 18px; font-weight: 500; color: #00ffff; letter-spacing: 1px; }
        
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #aaa; }
        
        select, input[type="color"] {
            width: 100%;
            padding: 8px;
            background: #333;
            border: 1px solid #555;
            border-radius: 4px;
            color: white;
            outline: none;
            cursor: pointer;
        }

        .status {
            font-size: 12px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
            color: #888;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff4444;
            transition: background-color 0.3s;
        }
        
        .status-dot.active { background-color: #00ff00; box-shadow: 0 0 8px #00ff00; }

        button#fs-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(45deg, #00ffff, #0088ff);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s;
        }
        button#fs-btn:hover { opacity: 0.9; }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 24px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="loading">正在加载视觉模型...</div>
    <video id="video-preview" playsinline></video>

    <div id="ui-container">
        <h2>粒子控制台</h2>
        
        <div class="control-group">
            <label>展示模型</label>
            <select id="shape-select">
                <option value="heart">机械之心 (Heart)</option>
                <option value="flower">数字莲花 (Flower)</option>
                <option value="saturn">土星环 (Saturn)</option>
                <option value="helix">双螺旋 (DNA Helix)</option>
                <option value="fireworks">爆炸烟花 (Fireworks)</option>
            </select>
        </div>

        <div class="control-group">
            <label>粒子颜色</label>
            <input type="color" id="color-picker" value="#00ffff">
        </div>

        <button id="fs-btn">进入全屏沉浸模式</button>

        <div class="status">
            <div class="status-dot" id="hand-status"></div>
            <span id="status-text">等待摄像头授权...</span>
        </div>
        <div style="font-size:10px; color:#555; margin-top:5px;">双手张开=扩散，合拢=聚拢</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/+esm"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- 全局变量 ---
        let scene, camera, renderer, particles, geometry, controls;
        let originalPositions = []; // 存储目标形状的原始坐标
        let currentPositions = [];  // 存储当前动画坐标
        const particleCount = 15000;
        let handLandmarker;
        let webcamRunning = false;
        let targetShape = 'heart';
        let interactionFactor = 1.0; // 1 = 正常, >1 扩散, <1 聚拢
        const videoElement = document.getElementById('video-preview');
        
        // --- 初始化 Three.js ---
        function initThree() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.02);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 1.0;

            // 创建粒子系统
            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            
            for(let i=0; i<particleCount * 3; i++) {
                positions[i] = (Math.random() - 0.5) * 100;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            
            // 材质
            const material = new THREE.PointsMaterial({
                color: 0x00ffff,
                size: 0.15,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // 监听窗口大小
            window.addEventListener('resize', onWindowResize);

            // 生成初始形状
            generateShape('heart');
            animate();
        }

        // --- 形状生成算法 ---
        function generateShape(type) {
            const positions = [];
            targetShape = type;
            
            // 预计算一些随机分布，用于烟花或填充
            for (let i = 0; i < particleCount; i++) {
                let x, y, z;
                
                if (type === 'heart') {
                    // 3D 心形公式
                    const t = Math.random() * Math.PI * 2;
                    const u = Math.random() * Math.PI;
                    // 这是一个简化的心形变体
                    x = 16 * Math.pow(Math.sin(t), 3) * Math.sin(u);
                    y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * Math.sin(u);
                    z = 6 * Math.cos(u); 
                    // 稍微打散一点
                    x *= 0.5; y *= 0.5; z *= 0.5;
                } 
                else if (type === 'flower') {
                    // 数字莲花 (基于极坐标/玫瑰线)
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = 10 * Math.sin(5 * theta) * Math.sin(phi) + 2;
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi) * (Math.sin(3*theta)+1.5);
                }
                else if (type === 'saturn') {
                    // 土星: 球体 + 环
                    if (i < particleCount * 0.3) {
                        // 星球本体
                        const r = 6;
                        const theta = Math.random() * Math.PI * 2;
                        const phi = Math.acos(2 * Math.random() - 1);
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = r * Math.cos(phi);
                    } else {
                        // 环
                        const angle = Math.random() * Math.PI * 2;
                        const radius = 9 + Math.random() * 6;
                        x = Math.cos(angle) * radius;
                        z = Math.sin(angle) * radius;
                        y = (Math.random() - 0.5) * 0.5; // 薄薄一层
                        
                        // 给环倾斜一点
                        const tilt = 0.4;
                        const y_new = y * Math.cos(tilt) - z * Math.sin(tilt);
                        const z_new = y * Math.sin(tilt) + z * Math.cos(tilt);
                        y = y_new; z = z_new;
                    }
                }
                else if (type === 'helix') {
                    // 双螺旋 DNA
                    const t = i * 0.05;
                    const radius = 5;
                    // 链1
                    if (i % 2 === 0) {
                        x = Math.cos(t) * radius;
                        z = Math.sin(t) * radius;
                        y = (i * 0.01) - 20;
                    } else {
                        // 链2 (相位差 PI)
                        x = Math.cos(t + Math.PI) * radius;
                        z = Math.sin(t + Math.PI) * radius;
                        y = (i * 0.01) - 20;
                    }
                }
                else if (type === 'fireworks') {
                    // 爆炸态，速度向量
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = Math.random() * 30; // 极度分散
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                }

                positions.push(x, y, z);
            }
            originalPositions = positions;
        }

        // --- MediaPipe 手势识别 ---
        async function setupMediaPipe() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
            );
            
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('status-text').innerText = "请允许摄像头权限";
            startWebcam();
        }

        function startWebcam() {
            const constraints = { video: { width: 320, height: 240 } };
            navigator.mediaDevices.getUserMedia(constraints).then((stream) => {
                videoElement.srcObject = stream;
                videoElement.addEventListener("loadeddata", predictWebcam);
                document.getElementById('status-text').innerText = "系统运行中 - 请在摄像头前张合手掌";
                document.getElementById('hand-status').classList.add('active');
            }).catch(err => {
                console.error(err);
                document.getElementById('status-text').innerText = "摄像头访问失败 (请使用HTTPS或本地环境)";
            });
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (handLandmarker && videoElement.currentTime !== lastVideoTime) {
                lastVideoTime = videoElement.currentTime;
                const startTimeMs = performance.now();
                const results = handLandmarker.detectForVideo(videoElement, startTimeMs);

                if (results.landmarks && results.landmarks.length > 0) {
                    // 获取第一只手
                    const landmarks = results.landmarks[0];
                    
                    // 计算拇指(4)和食指(8)的距离
                    const thumb = landmarks[4];
                    const index = landmarks[8];
                    
                    // 简单的3D距离计算
                    const distance = Math.sqrt(
                        Math.pow(thumb.x - index.x, 2) +
                        Math.pow(thumb.y - index.y, 2) +
                        Math.pow(thumb.z - index.z, 2)
                    );

                    // 归一化处理：通常距离在 0.05 (闭合) 到 0.2 (张开) 之间
                    // 映射到 interactionFactor: 0.5 (紧缩) 到 2.5 (爆炸)
                    
                    // 稍微平滑一下数值
                    let targetFactor = THREE.MathUtils.mapLinear(distance, 0.02, 0.2, 0.2, 2.5);
                    targetFactor = THREE.MathUtils.clamp(targetFactor, 0.5, 3.0);
                    
                    // 线性插值使变化更柔和
                    interactionFactor = THREE.MathUtils.lerp(interactionFactor, targetFactor, 0.1);
                    
                } else {
                    // 如果没检测到手，缓慢恢复到 1.0
                    interactionFactor = THREE.MathUtils.lerp(interactionFactor, 1.0, 0.05);
                }
            }
            window.requestAnimationFrame(predictWebcam);
        }

        // --- 核心动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            const positions = particles.geometry.attributes.position.array;
            const time = Date.now() * 0.001;

            for (let i = 0; i < particleCount; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                // 目标位置
                const tx = originalPositions[ix];
                const ty = originalPositions[iy];
                const tz = originalPositions[iz];

                // 1. 应用手势交互 (缩放)
                // 基于原点进行缩放
                const targetX = tx * interactionFactor;
                const targetY = ty * interactionFactor;
                const targetZ = tz * interactionFactor;

                // 2. 添加一些微小的噪点运动 (呼吸感)
                const noise = Math.sin(time + tx * 0.5) * 0.1;

                // 3. 物理平滑移动 (Lerp)
                // 当前位置逼近目标位置
                positions[ix] += (targetX + noise - positions[ix]) * 0.05;
                positions[iy] += (targetY + noise - positions[iy]) * 0.05;
                positions[iz] += (targetZ + noise - positions[iz]) * 0.05;
            }

            particles.geometry.attributes.position.needsUpdate = true;

            // 烟花模式下的特殊旋转
            if (targetShape === 'fireworks') {
                particles.rotation.y += 0.002;
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- UI 事件绑定 ---
        document.getElementById('shape-select').addEventListener('change', (e) => {
            generateShape(e.target.value);
            // 切换模型时重置旋转
            controls.reset();
        });

        document.getElementById('color-picker').addEventListener('input', (e) => {
            particles.material.color.set(e.target.value);
        });

        document.getElementById('fs-btn').addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        // --- 启动程序 ---
        initThree();
        setupMediaPipe(); // 加载AI模型

    </script>
</body>
</html>
